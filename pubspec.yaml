name: aztro_boutique
description: Tienda de ropa de diseñador multiplataforma sin telemetría.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
